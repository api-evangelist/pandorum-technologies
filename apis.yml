name: Pandorum Technologies
description: Pandorum Technologies is a biotechnology company based in Bangalore, India, working in
  tissue engineering and regenerative medicine under the theme "building blocks of life." Its research
  and product pipeline spans a bioengineered cornea for corneal disorders, 3D human liver organoids
  ("mini liver") for drug discovery and disease modeling, and cell-free exosomal therapy for lung
  regeneration after trauma. The underlying platform combines bio-materials, cellular engineering
  (mesenchymal stem cell culture), exosome and nanotherapy, and bio-fabrication. It was surfaced in the
  API Evangelist network as a 500 Global portfolio company; as a therapeutics and research organization
  it publishes no developer API, documentation, or developer portal.
